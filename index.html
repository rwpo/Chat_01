    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800&display=swap');
        
        body {
            font-family: 'Lexend', sans-serif;
            background-color: #F1F5F9;
            color: #0F172A;
        }

        .drop-zone {
            min-width: 100px;
            min-height: 44px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 3px dashed #94A3B8;
            border-radius: 0.75rem;
            background-color: #FFFFFF;
            transition: all 0.2s ease;
            vertical-align: middle;
            margin: 2px 4px;
            padding: 2px 8px;
        }

        .drop-zone.drag-over {
            border-color: #2563EB;
            background-color: #EFF6FF;
            transform: scale(1.05);
        }

        .drop-zone.filled {
            border-style: solid;
            border-color: #94A3B8;
            background-color: #F8FAFC;
        }

        .drop-zone.correct {
            border-color: #16A34A !important;
            background-color: #DCFCE7 !important;
        }

        .drop-zone.incorrect {
            border-color: #DC2626 !important;
            background-color: #FEE2E2 !important;
            animation: shake 0.4s ease-in-out;
        }

        .draggable-item {
            user-select: none;
            touch-action: none;
            cursor: grab;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .draggable-item:active {
            cursor: grabbing;
            transform: scale(1.05);
        }

        .badge-pronome {
            background-color: #E0F2FE;
            color: #0369A1;
            border: 2px solid #0284C7;
        }

        .badge-verbo {
            background-color: #FEF3C7;
            color: #B45309;
            border: 2px solid #D97706;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }
    </style>
</head>

    <script>
        // Estado Global do Aplicativo
        let currentCategoryIndex = 0;
        let currentDialogueIndex = 0;
        let selectedWordElement = null; // Suporte para seleção por toque em dispositivos móveis
        let userAnswers = {}; // Guarda estado { slotId: wordId }

        // Elementos DOM principais
        const categoryTabsContainer = document.getElementById('category-tabs');
        const catEmoji = document.getElementById('cat-emoji');
        const catTitle = document.getElementById('cat-title');
        const dialogueCounter = document.getElementById('dialogue-counter');
        const dialogueSelect = document.getElementById('dialogue-select');
        const dialogueContainer = document.getElementById('dialogue-container');
        const wordsBank = document.getElementById('words-bank');
        
        const feedbackBox = document.getElementById('feedback-box');
        const feedbackText = document.getElementById('feedback-text');
        const feedbackIcon = document.getElementById('feedback-icon');
        const hintBox = document.getElementById('hint-box');
        const hintText = document.getElementById('hint-text');

        const checkBtn = document.getElementById('check-btn');
        const hintBtn = document.getElementById('hint-btn');
        const solutionBtn = document.getElementById('solution-btn');
        const advanceBtn = document.getElementById('advance-btn');
        const prevBtn = document.getElementById('prev-btn');
        const nextDialogueBtn = document.getElementById('next-dialogue-btn');

        // Inicializador
        function initApp() {
            renderCategoryTabs();
            loadCategory(0);

            // Event Listeners Globais
            checkBtn.addEventListener('click', validateAnswers);
            hintBtn.addEventListener('click', toggleHint);
            solutionBtn.addEventListener('click', showSolution);
            advanceBtn.addEventListener('click', goToNextDialogue);
            prevBtn.addEventListener('click', goToPrevDialogue);
            nextDialogueBtn.addEventListener('click', goToNextDialogue);

            dialogueSelect.addEventListener('change', (e) => {
                const diagIndex = parseInt(e.target.value, 10);
                loadDialogue(diagIndex);
            });
        }

        function renderCategoryTabs() {
            categoryTabsContainer.innerHTML = '';
            categories.forEach((cat, idx) => {
                const btn = document.createElement('button');
                btn.className = `flex items-center gap-2 px-4 py-2.5 rounded-xl font-bold transition border-2 text-xs md:text-sm whitespace-nowrap ${
                    idx === currentCategoryIndex 
                    ? 'bg-blue-600 text-white border-blue-600 shadow-sm' 
                    : 'bg-white text-slate-700 border-slate-200 hover:bg-slate-50'
                }`;
                btn.innerHTML = `<span>${cat.emoji}</span> <span>${cat.title}</span>`;
                btn.addEventListener('click', () => loadCategory(idx));
                categoryTabsContainer.appendChild(btn);
            });
        }

        function loadCategory(catIdx) {
            currentCategoryIndex = catIdx;
            renderCategoryTabs();

            // Filtrar diálogos pertencentes a esta categoria
            const activeCat = categories[catIdx];
            const catDialogues = dialoguesData.filter(d => d.catId === activeCat.id);

            // Atualiza Seletor de Diálogos
            dialogueSelect.innerHTML = '';
            catDialogues.forEach((diag, idx) => {
                const globalIndex = dialoguesData.findIndex(d => d.id === diag.id);
                const opt = document.createElement('option');
                opt.value = globalIndex;
                opt.textContent = `${diag.id}. ${diag.title}`;
                dialogueSelect.appendChild(opt);
            });

            // Carrega o primeiro diálogo da categoria selecionada
            const firstGlobalIndex = dialoguesData.findIndex(d => d.catId === activeCat.id);
            loadDialogue(firstGlobalIndex);
        }

        function loadDialogue(globalIndex) {
            currentDialogueIndex = globalIndex;
            userAnswers = {};
            selectedWordElement = null;

            const diag = dialoguesData[globalIndex];
            const currentCat = categories.find(c => c.id === diag.catId);

            // Atualizar cabeçalhos e navegação
            catEmoji.textContent = currentCat.emoji;
            catTitle.textContent = currentCat.title;
            
            // Atualizar contador da categoria
            const catDialogues = dialoguesData.filter(d => d.catId === diag.catId);
            const relativeIdx = catDialogues.findIndex(d => d.id === diag.id) + 1;
            dialogueCounter.textContent = `Diálogo ${relativeIdx} de ${catDialogues.length} (Total: ${diag.id}/50)`;

            dialogueSelect.value = globalIndex;

            // Esconder feedback e dicas
            feedbackBox.classList.add('hidden');
            advanceBtn.classList.add('hidden');
            hintBox.classList.add('hidden');
            hintText.textContent = diag.hint;

            renderDialogueContent(diag);
            renderWordsBank(diag);
            
            lucide.createIcons();
        }

        function renderDialogueContent(diag) {
            dialogueContainer.innerHTML = '';

            diag.lines.forEach(line => {
                const bubble = document.createElement('div');
                bubble.className = "flex items-start gap-3 p-3.5 md:p-4 rounded-2xl bg-slate-50 border-2 border-slate-200";

                const avatar = document.createElement('div');
                avatar.className = "text-2xl md:text-3xl p-2 bg-white rounded-xl shadow-sm border border-slate-100 flex-shrink-0";
                avatar.textContent = line.avatar;

                const content = document.createElement('div');
                content.className = "flex-grow text-slate-800 text-sm md:text-base font-medium leading-relaxed";

                const speakerName = document.createElement('span');
                speakerName.className = "block text-[11px] font-bold text-slate-400 uppercase tracking-wide mb-0.5";
                speakerName.textContent = line.speaker;

                const sentence = document.createElement('p');
                sentence.className = "flex flex-wrap items-center gap-y-1.5";

                line.parts.forEach(part => {
                    if (part.text) {
                        const span = document.createElement('span');
                        span.textContent = part.text;
                        sentence.appendChild(span);
                    } else if (part.slotId) {
                        const zone = document.createElement('div');
                        zone.className = 'drop-zone';
                        zone.dataset.slotId = part.slotId;
                        zone.dataset.correctId = part.correctId;
                        
                        setupDropZoneEvents(zone);
                        sentence.appendChild(zone);
                    }
                });

                content.appendChild(speakerName);
                content.appendChild(sentence);
                bubble.appendChild(avatar);
                bubble.appendChild(content);
                dialogueContainer.appendChild(bubble);
            });
        }

        function renderWordsBank(diag) {
            wordsBank.innerHTML = '';
            
            // Embaralhar palavras para o desafio
            const shuffled = [...diag.words].sort(() => Math.random() - 0.5);

            shuffled.forEach(word => {
                const card = document.createElement('div');
                const badgeClass = word.type === 'pronome' ? 'badge-pronome' : 'badge-verbo';
                
                card.className = `draggable-item px-3.5 py-2 rounded-xl font-bold text-sm md:text-base shadow-sm ${badgeClass} flex items-center justify-center cursor-pointer select-none`;
                card.textContent = word.text;
                card.draggable = true;
                card.dataset.wordId = word.id;
                card.dataset.wordType = word.type;

                setupDraggableEvents(card);
                wordsBank.appendChild(card);
            });
        }

        function setupDraggableEvents(el) {
            el.addEventListener('dragstart', (e) => {
                el.classList.add('opacity-50');
                e.dataTransfer.setData('text/plain', el.dataset.wordId);
            });

            el.addEventListener('dragend', () => {
                el.classList.remove('opacity-50');
            });

            // Seleção por toque/clique (Smartphones & Tablets)
            el.addEventListener('click', () => {
                if (selectedWordElement === el) {
                    selectedWordElement.classList.remove('ring-4', 'ring-blue-500');
                    selectedWordElement = null;
                } else {
                    if (selectedWordElement) {
                        selectedWordElement.classList.remove('ring-4', 'ring-blue-500');
                    }
                    selectedWordElement = el;
                    selectedWordElement.classList.add('ring-4', 'ring-blue-500');
                }
            });
        }

        function setupDropZoneEvents(zone) {
            zone.addEventListener('dragover', (e) => {
                e.preventDefault();
                zone.classList.add('drag-over');
            });

            zone.addEventListener('dragleave', () => {
                zone.classList.remove('drag-over');
            });

            zone.addEventListener('drop', (e) => {
                e.preventDefault();
                zone.classList.remove('drag-over');
                const wordId = e.dataTransfer.getData('text/plain');
                const wordEl = document.querySelector(`[data-word-id="${wordId}"]`);
                if (wordEl) {
                    placeWordInSlot(wordEl, zone);
                }
            });

            zone.addEventListener('click', () => {
                if (selectedWordElement) {
                    placeWordInSlot(selectedWordElement, zone);
                    selectedWordElement.classList.remove('ring-4', 'ring-blue-500');
                    selectedWordElement = null;
                } else if (zone.firstChild) {
                    returnWordToBank(zone);
                }
            });
        }

        function placeWordInSlot(wordEl, zone) {
            if (zone.firstChild) {
                returnWordToBank(zone);
            }

            zone.appendChild(wordEl);
            zone.classList.add('filled');
            userAnswers[zone.dataset.slotId] = wordEl.dataset.wordId;
            wordEl.classList.remove('ring-4', 'ring-blue-500');
        }

        function returnWordToBank(zone) {
            const wordEl = zone.firstChild;
            if (wordEl) {
                wordsBank.appendChild(wordEl);
                zone.classList.remove('filled', 'correct', 'incorrect');
                delete userAnswers[zone.dataset.slotId];
            }
        }

        function validateAnswers() {
            const zones = dialogueContainer.querySelectorAll('.drop-zone');
            let allFilled = true;
            let correctCount = 0;

            zones.forEach(zone => {
                const slotId = zone.dataset.slotId;
                const correctId = zone.dataset.correctId;
                const userWordId = userAnswers[slotId];

                zone.classList.remove('correct', 'incorrect');

                if (!userWordId) {
                    allFilled = false;
                } else if (userWordId === correctId) {
                    zone.classList.add('correct');
                    correctCount++;
                } else {
                    zone.classList.add('incorrect');
                }
            });

            feedbackBox.classList.remove('hidden', 'bg-emerald-100', 'bg-amber-100', 'bg-rose-100', 'text-emerald-800', 'text-amber-800', 'text-rose-800');

            if (!allFilled) {
                feedbackBox.classList.add('bg-amber-100', 'text-amber-800');
                feedbackIcon.setAttribute('data-lucide', 'alert-circle');
                feedbackText.textContent = 'Preencha todas as lacunas antes de verificar.';
                advanceBtn.classList.add('hidden');
            } else if (correctCount === zones.length) {
                feedbackBox.classList.add('bg-emerald-100', 'text-emerald-800');
                feedbackIcon.setAttribute('data-lucide', 'check-circle-2');
                feedbackText.textContent = 'Parabéns! Diálogo correto!';
                advanceBtn.classList.remove('hidden');
            } else {
                feedbackBox.classList.add('bg-rose-100', 'text-rose-800');
                feedbackIcon.setAttribute('data-lucide', 'x-circle');
                feedbackText.textContent = 'Existem erros no diálogo. Ajuste as palavras!';
                advanceBtn.classList.add('hidden');
            }

            lucide.createIcons();
        }

        function toggleHint() {
            hintBox.classList.toggle('hidden');
            lucide.createIcons();
        }

        function showSolution() {
            const diag = dialoguesData[currentDialogueIndex];
            const zones = dialogueContainer.querySelectorAll('.drop-zone');

            zones.forEach(zone => {
                const correctId = zone.dataset.correctId;
                const wordObj = diag.words.find(w => w.id === correctId);
                const wordEl = document.querySelector(`[data-word-id="${correctId}"]`);

                if (wordEl) {
                    placeWordInSlot(wordEl, zone);
                    zone.classList.remove('incorrect');
                    zone.classList.add('correct');
                }
            });

            validateAnswers();
        }

        function goToNextDialogue() {
            if (currentDialogueIndex < dialoguesData.length - 1) {
                const nextDiag = dialoguesData[currentDialogueIndex + 1];
                const catIdx = categories.findIndex(c => c.id === nextDiag.catId);
                if (catIdx !== currentCategoryIndex) {
                    currentCategoryIndex = catIdx;
                    renderCategoryTabs();
                }
                loadDialogue(currentDialogueIndex + 1);
            } else {
                loadDialogue(0); // Volta ao início
            }
        }

        function goToPrevDialogue() {
            if (currentDialogueIndex > 0) {
                const prevDiag = dialoguesData[currentDialogueIndex - 1];
                const catIdx = categories.findIndex(c => c.id === prevDiag.catId);
                if (catIdx !== currentCategoryIndex) {
                    currentCategoryIndex = catIdx;
                    renderCategoryTabs();
                }
                loadDialogue(currentDialogueIndex - 1);
            }
        }

        window.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
